name: Milk Attic Cache

on:
  schedule:
    # 08:00 Asia/Tokyo (23:00 UTC on the previous day).
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: milk-attic-cache
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.2
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://attic.odango.app/odango https://cache.numtide.com https://akazdayo-nixos-config.cachix.org
            extra-trusted-public-keys = odango:8blIZl1xfwVCsNo2vUDYP5OXgwWAcC5WJDI1HuoeKLk= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= akazdayo-nixos-config.cachix.org-1:beIgz4A31qNo0DBTEaTGbNy/xGuNJZZpH0n3BDc+JVk=

      - name: Update flake inputs
        run: nix flake update

      - name: Install Attic from the locked nixpkgs
        run: |
          nix build --inputs-from . nixpkgs#attic-client --no-update-lock-file --out-link "$RUNNER_TEMP/attic-client"
          echo "$RUNNER_TEMP/attic-client/bin" >> "$GITHUB_PATH"

      - name: Configure Attic and record locally built outputs
        id: configure
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [[ -z "$ATTIC_TOKEN" ]]; then
            echo "::error::Set the ATTIC_TOKEN repository secret with pull/push access to the odango cache."
            exit 1
          fi
          attic login ci https://attic.odango.app/ "$ATTIC_TOKEN"
          attic cache info ci:odango
          touch "$RUNNER_TEMP/attic-built-paths"
          # The daemon runs this hook. Queue paths without requiring its credentials.
          cat > "$RUNNER_TEMP/attic-post-build-hook" <<EOF
          #!/bin/sh
          set -efu
          # Nix supplies space-separated store paths; globbing is disabled above.
          # shellcheck disable=SC2086
          printf '%s\n' \$OUT_PATHS >> "$RUNNER_TEMP/attic-built-paths"
          EOF
          chmod +x "$RUNNER_TEMP/attic-post-build-hook"

      - name: Build Milk using available substitutes
        # Leave time to push successful outputs even when this step times out.
        timeout-minutes: 300
        run: |
          nix build .#nixosConfigurations.milk.config.system.build.toplevel \
            --no-update-lock-file --no-link --keep-going --print-build-logs \
            --option post-build-hook "$RUNNER_TEMP/attic-post-build-hook" &
          build_pid=$!
          # Keep the runner alive so the final upload can run after disk pressure.
          (
            while kill -0 "$build_pid" 2>/dev/null; do
              available=$(df -B1 --output=avail /nix/store | tail -n 1)
              if (( available < 3 * 1024 * 1024 * 1024 )); then
                echo "::error::Less than 3 GiB free; stopping the build to preserve completed outputs for upload."
                kill -TERM "$build_pid" 2>/dev/null || true
                break
              fi
              sleep 10
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          wait "$build_pid"

      - name: Push locally built outputs to Attic
        if: ${{ always() && steps.configure.outcome == 'success' }}
        run: |
          df -h / /nix/store
          if [[ ! -s "$RUNNER_TEMP/attic-built-paths" ]]; then
            echo "No locally built outputs to push."
            exit 0
          fi
          # Include build-time dependencies, but do not mirror substituted closures.
          sort -u "$RUNNER_TEMP/attic-built-paths" | attic push --stdin --no-closure --jobs 20 ci:odango

      - name: Commit and push flake.lock after successful build and upload
        if: ${{ success() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --quiet --cached; then
            echo "flake.lock unchanged since checkout; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update flake.lock after Milk cache build"
          # Reject concurrent branch updates instead of publishing an untested merge.
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
