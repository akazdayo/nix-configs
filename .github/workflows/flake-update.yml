name: flake update

on:
  schedule:
    - cron: "0 3 1-31/3 * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      inputs: ${{ steps.flake-inputs.outputs.inputs }}
      build_matrix: ${{ steps.flake-inputs.outputs.build_matrix }}
      host_matrix: ${{ steps.flake-inputs.outputs.host_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read flake inputs
        id: flake-inputs
        run: |
          inputs=$(jq -c '.nodes.root.inputs | keys' flake.lock)
          hosts='[
            {"host":"milk","runs-on":"ubuntu-latest","flake-attr":"nixosConfigurations"},
            {"host":"hinata","runs-on":"ubuntu-latest","flake-attr":"nixosConfigurations"},
            {"host":"gateway","runs-on":"ubuntu-latest","flake-attr":"nixosConfigurations"},
            {"host":"minecraft","runs-on":"ubuntu-latest","flake-attr":"nixosConfigurations"},
            {"host":"chiffon","runs-on":"macos-latest","flake-attr":"darwinConfigurations"}
          ]'
          build_matrix=$(jq -cn --argjson inputs "$inputs" --argjson hosts "$hosts" \
            '{include: [ $inputs[] as $input | $hosts[] | . + {input: $input} ]}')
          host_matrix=$(jq -cn --argjson hosts "$hosts" '{include: $hosts}')
          echo "inputs=$inputs" >> "$GITHUB_OUTPUT"
          echo "build_matrix=$build_matrix" >> "$GITHUB_OUTPUT"
          echo "host_matrix=$host_matrix" >> "$GITHUB_OUTPUT"

  update:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        input: ${{ fromJSON(needs.discover.outputs.inputs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Update ${{ matrix.input }}
        run: nix flake lock --update-input "${{ matrix.input }}"

      - name: Upload flake.lock for ${{ matrix.input }}
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock-${{ matrix.input }}-${{ github.run_id }}
          path: flake.lock

  build:
    needs: [discover, update]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.build_matrix) }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download flake.lock for ${{ matrix.input }}
        uses: actions/download-artifact@v4
        with:
          name: flake-lock-${{ matrix.input }}-${{ github.run_id }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Restore / configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME || 'akazdayo' }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      - name: Configure Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build ${{ matrix.host }} with ${{ matrix.input }} updated
        run: nix build ".#${{ matrix.flake-attr }}.${{ matrix.host }}.config.system.build.toplevel" --print-build-logs

  finalize:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Update all flake inputs for the final lock
        run: nix flake update

      - name: Upload final flake.lock
        uses: actions/upload-artifact@v4
        with:
          name: final-flake-lock-${{ github.run_id }}
          path: flake.lock

  distribute:
    needs: [discover, finalize]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.host_matrix) }}
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download final flake.lock
        uses: actions/download-artifact@v4
        with:
          name: final-flake-lock-${{ github.run_id }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Restore / configure Cachix for distribution
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME || 'akazdayo' }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Configure Magic Nix Cache for distribution
        uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build and push ${{ matrix.host }}
        run: nix build ".#${{ matrix.flake-attr }}.${{ matrix.host }}.config.system.build.toplevel" --print-build-logs

  commit:
    needs: distribute
    if: needs.distribute.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download final flake.lock
        uses: actions/download-artifact@v4
        with:
          name: final-flake-lock-${{ github.run_id }}

      - name: Commit and push flake.lock
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git diff --quiet --cached; then
            echo "flake.lock unchanged since checkout; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update flake.lock"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
