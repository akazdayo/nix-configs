# niks3 secrets — encrypt with: sops encrypt secrets/server/niks3.yaml
# niks3-s3-access-key and niks3-s3-secret-key must match RustFS credentials.
niks3-api-token: "<generate-with: openssl rand -base64 32>"
niks3-signing-key: "main:<generate-with: nix key generate-secret --key-name main>"
niks3-s3-access-key: "<same-as-RUSTFS_ACCESS_KEY>"
niks3-s3-secret-key: "<same-as-RUSTFS_SECRET_KEY>"
